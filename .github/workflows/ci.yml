name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Validate plugin
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Validate retained source integrity
        run: bun scripts/validate-inherited-source.mjs

      - name: Check shell scripts
        run: |
          bash -n skills/poteto-mode/scripts/worktree-audit.sh
          bash -n skills/show-me-your-work/scripts/log.sh

      - name: Install script dependencies
        working-directory: skills/poteto-mode/scripts
        run: bun install --frozen-lockfile

      - name: Typecheck scripts
        working-directory: skills/poteto-mode/scripts
        run: bun run typecheck

      - name: Run script tests
        working-directory: skills/poteto-mode/scripts
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: commit.gpgsign
          GIT_CONFIG_VALUE_0: "false"
        run: bun run test
